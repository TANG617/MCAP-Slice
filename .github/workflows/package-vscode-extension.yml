name: Package VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

concurrency:
  group: package-vscode-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          extension_version="$(node -p "require('./package.json').version")"
          expected_tag="vscode-v${extension_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $extension_version." >&2
            echo "Expected tag: $expected_tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main." >&2
            exit 1
          fi
          echo "version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and worker tests
        run: npm test

      - name: VS Code integration test
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcap-slice-vscode-${{ steps.version.outputs.version }}
          path: dist/mcap-slice-vscode.vsix
          if-no-files-found: error
          retention-days: 30
